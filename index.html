<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yadav Study Planner</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
margin-bottom:15px;
}

.progress{
width:100%;
height:20px;
background:#334155;
border-radius:10px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:#22c55e;
}

.task{
display:flex;
justify-content:space-between;
margin:10px 0;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
}

.complete{
background:#22c55e;
color:white;
}

.timer{
font-size:40px;
text-align:center;
margin:15px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>📚 Yadav JEE Planner</h1>
<h3>Daily Study Dashboard</h3>
</div>

<div class="card">
<h2>Today's Progress</h2>
<br>
<div class="progress">
<div class="progress-bar" id="bar"></div>
</div>
<br>
<p id="percent">0%</p>
</div>

<div class="card">
<h2>Today's Tasks</h2>

<div class="task">
<span>Maths - Matrices</span>
<button class="complete" onclick="done()">Done</button>
</div>

<div class="task">
<span>Physics - Electrostatics</span>
<button class="complete" onclick="done()">Done</button>
</div>

<div class="task">
<span>Chemistry - Haloalkanes</span>
<button class="complete" onclick="done()">Done</button>
</div>

</div>

<div class="card">
<h2>Pomodoro Timer</h2>

<div class="timer" id="timer">
25:00
</div>

<center>
<button onclick="startTimer()">Start</button>
</center>

</div>

<div class="card">
<h2>JEE Target</h2>
<p>Target Rank: AIR 5000</p>
<p>Study Hours Today: 4 Hours</p>
<p>Current Streak: 🔥 0 Days</p>
</div>

</div>

<script>

let completed=0;

function done(){

completed++;

let percent=(completed/3)*100;

document.getElementById("bar").style.width=percent+"%";

document.getElementById("percent").innerHTML=
Math.min(percent,100)+"%";

}

let time=1500;

function startTimer(){

let interval=setInterval(()=>{

let min=Math.floor(time/60);
let sec=time%60;

document.getElementById("timer").innerHTML=
`${min}:${sec<10?'0':''}${sec}`;

time--;

if(time<0){
clearInterval(interval);
alert("Session Complete!");
}

},1000);

}

</script>

</body>
</html>
